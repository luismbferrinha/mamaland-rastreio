<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mamaland cocoa traceability</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="assets/logo.png"><style>
:root { --g:#3A7267; --gd:#173C30; --o:#D37C32; --c:#E6CAB4; --bg:#F7F2EC; --ink:#22302B; --mut:#6B7A74; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif; }
a { color:var(--g); }
header { background:var(--gd); color:#fff; padding:18px 16px 22px; }
.wrap { max-width:1080px; margin:0 auto; }
header img { height:30px; display:block; }
header .sub { margin-top:14px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--c); }
header h1 { margin:4px 0 0; font-size:28px; letter-spacing:.01em; }
.status { display:inline-flex; align-items:center; gap:8px; margin-top:12px; background:var(--o); color:#fff;
           border-radius:999px; padding:6px 14px; font-size:14px; font-weight:600; }
main { padding:16px; }
.facts { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:-8px; }
.fact { background:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.k { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--o); }
.v { font-size:18px; font-weight:600; margin-top:4px; color:var(--gd); }
.v small { display:block; font-size:12px; font-weight:400; color:var(--mut); margin-top:2px; }
.cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:16px; margin-top:16px; }
.card { background:#fff; border-radius:12px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
.card h2 { margin:0 0 14px; font-size:16px; color:var(--gd); }
ol.tl { list-style:none; margin:0; padding:0; }
ol.tl li { position:relative; padding:0 0 22px 38px; }
ol.tl li:last-child { padding-bottom:0; }
ol.tl li::before { content:""; position:absolute; left:11px; top:24px; bottom:0; width:2px; background:var(--g); opacity:.35; }
ol.tl li:last-child::before { display:none; }
.dot { position:absolute; left:0; top:0; width:24px; height:24px; border-radius:50%; background:var(--g); color:#fff;
        display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
li.now .dot { background:var(--o); box-shadow:0 0 0 5px rgba(211,124,50,.2); }
.ev { font-weight:600; font-size:15px; }
.when { font-size:14px; color:var(--mut); margin-top:2px; }
.dur { display:inline-block; margin-top:6px; font-size:12px; color:var(--g); background:rgba(58,114,103,.1);
        border-radius:6px; padding:2px 8px; }
#map { height:420px; border-radius:10px; background:#dfe6e2; }
.maphead { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:12px; }
.maphead h2 { margin:0; }
.maphead p { margin:4px 0 0; font-size:13px; color:var(--mut); }
.btn { display:inline-flex; align-items:center; gap:6px; background:var(--g); color:#fff; text-decoration:none;
        border-radius:8px; padding:9px 14px; font-size:14px; font-weight:600; white-space:nowrap; }
.btn:hover { background:var(--gd); }
.note { margin-top:16px; font-size:13px; color:var(--mut); background:#fff; border-left:4px solid var(--c);
         border-radius:8px; padding:10px 14px; }
footer { text-align:center; padding:26px 16px 34px; font-size:12px; letter-spacing:.18em; color:var(--mut); text-transform:uppercase; }
@media (max-width:820px) { .cols { grid-template-columns:1fr; } .facts { grid-template-columns:1fr 1fr; } #map { height:320px; } }
@media (max-width:420px) { header h1 { font-size:24px; } .maphead { flex-direction:column; } }

.lbl{background:rgba(23,60,48,.85);color:#fff;border:0;box-shadow:none;font-weight:600}.lbl::before{display:none}</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script></head><body>
<div id="app">
<header><div class="wrap">
  <img src="assets/logo.png" alt="Mamaland">
  <div class="sub">Cocoa traceability · Cabinda · Angola</div>
  <h1 id="msg-h">Loading…</h1>
</div></header>
<main class="wrap"><div class="card" style="margin-top:8px" id="msg" hidden>
  <h2>Scan the QR code on your bag</h2>
  <p style="margin:0;color:var(--mut);font-size:14px">Each Mamaland cocoa bag has its own QR code. Point your phone camera
  at the code on the label to see where and when the beans in that bag were harvested, fermented and dried.</p>
</div></main>
</div>
<footer>Mamaland · Cabinda · Product of Angola</footer>
<script>
function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), function(c) { return c.charCodeAt(0); }); }
function aviso(t) { document.getElementById('msg-h').textContent = t; document.getElementById('msg').hidden = false; }
function mapa(d) {
  var m = L.map('map', {scrollWheelZoom:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'}).addTo(m);
  Object.keys(d.lotes).forEach(function(k) {
    if (k === d.lote) return;
    L.polygon(d.lotes[k].pts, {color:'#E6CAB4', weight:1, opacity:.8, fillOpacity:0}).bindTooltip(k + ' · ' + d.lotes[k].nome).addTo(m);
  });
  var p = L.polygon(d.lotes[d.lote].pts, {color:'#D37C32', weight:3, fillColor:'#D37C32', fillOpacity:.25}).addTo(m);
  p.bindTooltip(d.rotulo, {permanent:true, direction:'center', className:'lbl'});
  m.fitBounds(p.getBounds(), {padding:[30,30]});
}
async function abrir() {
  var h = decodeURIComponent(location.hash.slice(1)), i = h.lastIndexOf('.');
  if (i < 1) return aviso('Trace your bag');
  var id = h.slice(0, i).toUpperCase(), k = h.slice(i + 1);
  try {
    var r = await fetch('d/' + encodeURIComponent(id) + '.json', {cache:'no-cache'});
    if (!r.ok) throw 0;
    var j = await r.json();
    var key = await crypto.subtle.importKey('raw', b64u(k), 'AES-GCM', false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64u(j.iv)}, key, b64u(j.ct));
    var d = JSON.parse(new TextDecoder().decode(pt));
    document.title = d.titulo;
    document.getElementById('app').innerHTML = d.html;
    if (d.lote && window.L) mapa(d);
  } catch (e) { aviso('Link not recognised'); }
}
window.addEventListener('hashchange', function() { location.reload(); });
abrir();
</script></body></html>
